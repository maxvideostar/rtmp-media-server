name: release
# Publică automat un release când se schimbă versiunea din main.go (var version = "x.y.z")
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versiune
        id: v
        run: |
          V=$(grep -oP 'var version = "\K[^"]+' main.go)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$V" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v5
        if: steps.v.outputs.exists == '0'
        with:
          go-version: "1.24"
      - name: Build
        if: steps.v.outputs.exists == '0'
        run: |
          V="${{ steps.v.outputs.version }}"
          LD="-s -w -X main.version=$V"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LD" -o dist/rtmp-media-server-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "$LD" -o dist/rtmp-media-server-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LD" -o dist/rtmp-media-server-windows-amd64.exe .
          mkdir -p win && cp dist/rtmp-media-server-windows-amd64.exe win/rtmp-media-server.exe && cp install.ps1 install.bat win/
          (cd win && zip -9 ../dist/rtmp-media-server-windows-amd64.zip *)
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == '0'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
